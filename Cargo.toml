[package]
name = "minecraft-rust-core"
version = "5.0.0"
edition = "2021"
authors = ["CentralCorp", "Riptiaz", "Luuxis"]
description = "Async Rust core library for launching Minecraft: Java Edition (Vanilla & Modded, Multi-Instance, Microsoft/AzAuth/Mojang Auth)"
license-file = "LICENSE.md"
repository = "https://github.com/CentralCorp/minecraft-rust-core"

[lib]
name = "minecraft_rust_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
flate2 = "1.0"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = "0.24"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls-tls",
    "gzip",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.10", features = ["v3", "v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.13"
